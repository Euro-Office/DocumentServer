worker_processes auto;
daemon off;
pid @RUN@/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
  include @SNAP@/etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_body_temp_path @RUN@/client_body;
  proxy_temp_path @RUN@/proxy;
  fastcgi_temp_path @RUN@/fastcgi;
  uwsgi_temp_path @RUN@/uwsgi;
  scgi_temp_path @RUN@/scgi;
  include @SNAP@/nginx/http-common.conf;
  server {
    listen @ADDRESS@:@PORT@ default_server;
    server_tokens off;
    set $secure_link_secret @LINK_SECRET@;
    include @SNAP@/nginx/ds-*.conf;
  }
}
