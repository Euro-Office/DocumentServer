name: Build

# Builds the Docker images and packages per arch × brand. Called by ci.yml
# (pull requests, main, manual runs) and release.yml (tags). Which targets
# are pushed, and under which tags, follows the caller's event and ref.

permissions: {}

on:
  workflow_call:
    inputs:
      full:
        description: 'Build every arch, brand and target; otherwise only the amd64 euro-office standalone image'
        required: true
        type: boolean
    outputs:
      is_stable:
        value: ${{ jobs.build.outputs.is_stable }}
      ref_name:
        value: ${{ jobs.build.outputs.ref_name }}
      product_version:
        value: ${{ jobs.build.outputs.product_version }}
      build_number:
        value: ${{ jobs.build.outputs.build_number }}
    secrets:
      EURO_OFFICE_MIRROR_TOKEN:
        required: true
      NEXTCLOUD_USER:
        required: false
      NEXTCLOUD_PASS:
        required: false
      NEXTCLOUD_RELEASES_USER:
        required: false
      NEXTCLOUD_RELEASES_TOKEN:
        required: false

env:
  REGISTRY: ghcr.io/euro-office
  CACHE_IMAGE_NAME: documentserver-build-cache
  BUILD_NUMBER: dev.1
  BUILD_ROOT: /package
  NEXTCLOUD_RELEASES_IMAGE: ghcr.io/nextcloud-releases/office-documentserver

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      targets: ${{ steps.scope.outputs.targets }}
    steps:
      - name: Choose matrix and targets
        id: scope
        env:
          FULL: ${{ inputs.full }}
          BRANDS: |
            [
              {
                "name": "euro-office",
                "image_name": "documentserver",
                "cluster_docs": "cluster-docs",
                "cluster_example": "cluster-example",
                "cluster_utils": "cluster-utils",
                "extra_bake_files": "",
                "extra_targets": "",
                "cache_prefix": ""
              },
              {
                "name": "nextcloud-office",
                "image_name": "nextcloud-office-documentserver",
                "cluster_docs": "nextcloud-office-cluster-docs",
                "cluster_example": "nextcloud-office-cluster-example",
                "cluster_utils": "nextcloud-office-cluster-utils",
                "extra_bake_files": "./brands/nextcloud-office-brand/brand-server.hcl",
                "extra_targets": "brand-icons,",
                "cache_prefix": "nextcloud-office-"
              }
            ]
        run: |
          set -euo pipefail
          if [[ "$FULL" == "true" ]]; then
            arch='["amd64","arm64"]'
            brands="$BRANDS"
            targets=packages,standalone,develop,cluster-utils,cluster-example,cluster-docs
          else
            echo "::notice::e2e-only build (amd64, euro-office, standalone). Add the full-build label and re-run for the full matrix."
            arch='["amd64"]'
            brands=$(jq '[.[] | select(.name == "euro-office")]' <<<"$BRANDS")
            targets=standalone
          fi
          echo "matrix=$(jq -nc --argjson arch "$arch" --argjson brand "$brands" '{arch: $arch, brand: $brand}')" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # BUILD
  #
  # Single job that builds the target graph in one bake invocation
  # per arch × brand (scope chosen by the caller). Because develop depends
  # on docker which depends on packages, bake resolves the shared
  # graph and never rebuilds a layer twice.
  #
  # Pushing per target:
  #   docker   → pushed on default branch (:nightly) and git tags (:latest)
  #   develop  → pushed on default branch only (:latest-dev)
  #   packages → never pushed; exported to local filesystem for release upload
  #              (euro-office → GitHub Release, nextcloud-office → artifact for
  #              the publish-nextcloud-* jobs)
  # ─────────────────────────────────────────────────────────────
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: scope
    outputs:
      # Identical in every matrix leg (depends on the ref only), so it does
      # not matter which leg writes it last.
      is_stable: ${{ steps.meta.outputs.is_stable }}
      ref_name: ${{ steps.meta.outputs.ref_name }}
      product_version: ${{ steps.meta.outputs.product_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}

    steps:
      - name: Checkout fork repository (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .
          submodules: recursive
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN }}
          # Keep the mirror token out of .git/config; later steps do not
          # need it.
          persist-credentials: false

      - name: Checkout nextcloud-office-brand repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Euro-Office/nextcloud-office-brand
          path: build/brands/nextcloud-office-brand
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN }}
          persist-credentials: false

      - name: Align submodules to requested branches
        shell: bash
        env:
          CORE_BRANCH:    ${{ github.event.inputs.core_branch || '' }}
          SDKJS_BRANCH:   ${{ github.event.inputs.sdkjs_branch || '' }}
          WEBAPPS_BRANCH: ${{ github.event.inputs.web_apps_branch || '' }}
          SERVER_BRANCH:  ${{ github.event.inputs.server_branch || '' }}
        run: |
          set -euo pipefail

          checkout_submodule() {
            local path=$1
            local branch=$2
            echo "🔧 Updating $path → $branch"
            pushd "$path" > /dev/null
            git fetch origin "${branch}:${branch}"
            git checkout "$branch"
            popd > /dev/null
          }

          [ -n "$CORE_BRANCH" ]    && checkout_submodule core      "$CORE_BRANCH"
          [ -n "$SDKJS_BRANCH" ]   && checkout_submodule sdkjs     "$SDKJS_BRANCH"
          [ -n "$WEBAPPS_BRANCH" ] && checkout_submodule web-apps  "$WEBAPPS_BRANCH"
          [ -n "$SERVER_BRANCH" ]  && checkout_submodule server    "$SERVER_BRANCH"

          checkout_submodule dictionaries       "main"
          checkout_submodule document-templates "main"

          echo "--- Submodule state after alignment ---"
          git submodule status

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and push flags
        id: meta
        env:
          NO_CACHE_INPUT: ${{ github.event.inputs.no_cache }}
          ARCH: ${{ matrix.arch }}
          BRAND: ${{ matrix.brand.name }}
        run: |
          REF_NAME=$(echo "$GITHUB_REF_NAME" | tr '/+' '--')
          echo "ref_name=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "build_commits=DocumentServer=$(git rev-parse HEAD) $(git submodule foreach --quiet 'echo $name=$(git rev-parse HEAD)' | tr '\n' ' ')" >> $GITHUB_OUTPUT

          # Cold rebuild when explicitly requested via workflow_dispatch or when
          # the PR title carries a [no-cache] marker. Lets a PR re-run ignore
          # the registry build cache (e.g. to discard a poisoned layer) while
          # still exercising the e2e job against the freshly built image.
          if [[ "$NO_CACHE_INPUT" == "true" \
                || "${{ contains(github.event.pull_request.title, '[no-cache]') }}" == "true" ]]; then
            echo "no_cache=true"  >> $GITHUB_OUTPUT
          else
            echo "no_cache=false" >> $GITHUB_OUTPUT
          fi

          IS_DEFAULT=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          IS_TAG=${{ startsWith(github.ref, 'refs/tags/') }}

          # Registry build cache: every ref reuses its own previous run and
          # falls back to main. Tags need no per-commit key (7b0fb05): release
          # tags are never moved, a content change gets a new version, and
          # layers are keyed by content anyway.
          echo "cache_ref=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "cache_fallback=main"   >> $GITHUB_OUTPUT

          # docker target: push on default branch and git tags. Tags push
          # <tag>-<arch>; publish-euro-office-images only moves :latest for
          # stable tags.
          if [[ "$IS_DEFAULT" == "true" ]]; then
            echo "images_tag=nightly-${ARCH}"  >> $GITHUB_OUTPUT
            echo "images_push=true"                       >> $GITHUB_OUTPUT
          elif [[ "$IS_TAG" == "true" ]]; then
            echo "images_tag=${REF_NAME}-${ARCH}" >> $GITHUB_OUTPUT
            echo "images_push=true"                          >> $GITHUB_OUTPUT
          else
            echo "images_tag=${REF_NAME}-${ARCH}" >> $GITHUB_OUTPUT
            echo "images_push=false"                         >> $GITHUB_OUTPUT
          fi

          # develop target: push on default branch only
          if [[ "$IS_DEFAULT" == "true" ]]; then
            echo "develop_push=true"  >> $GITHUB_OUTPUT
          else
            echo "develop_push=false" >> $GITHUB_OUTPUT
          fi

          # nextcloud-office images must not be pushed to ghcr.io/euro-office;
          # on tags its standalone image goes to ghcr.io/nextcloud-releases
          # instead (see nc_publish). Override the
          # flags for that brand (last write to $GITHUB_OUTPUT wins).
          if [[ "$BRAND" == "nextcloud-office" ]]; then
            echo "images_push=false"  >> $GITHUB_OUTPUT
            echo "develop_push=false" >> $GITHUB_OUTPUT
          fi

          # e2e image: pull_request builds don't push the release tags, so push
          # the amd64 euro-office standalone image under a throwaway pr-<n> tag
          # that the e2e job pulls. Layer dedup keeps the transfer small, and a
          # cleanup workflow deletes the tag when the PR closes. Other
          # arches/brands stay cacheonly. A manual dispatch on a branch (e.g. a
          # release/v* test build) exports the same image under <branch>.
          if [[ ( "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "workflow_dispatch" ) \
                && "$BRAND" == "euro-office" \
                && "$ARCH" == "amd64" ]]; then
            echo "export_image=true" >> $GITHUB_OUTPUT
          else
            echo "export_image=false" >> $GITHUB_OUTPUT
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "e2e_image=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "e2e_image=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${REF_NAME}" >> $GITHUB_OUTPUT
          fi

          # Stable release tags are the ones scripts/tag_release.sh creates
          # without -p: vX.Y.Z (e.g. v9.3.4). Only these are published into
          # the public APT/DNF archive; pre-release tags (v9.3.5-rc.1, v9.3.1-tp.3,
          # v9.3.1-beta.1, v9.3.4-hotfix.1, ...) all carry a "-" and are not.
          # Read the tag via $GITHUB_REF_NAME rather than a template expression:
          # the tag name is attacker-controllable (zizmor template-injection).
          if [[ "$IS_TAG" == "true" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

          # nextcloud-office release image: on tags the standalone image is
          # exported as an OCI archive and pushed to ghcr.io/nextcloud-releases
          # by a later step, with its own credential (see there).
          if [[ "$IS_TAG" == "true" && "$BRAND" == "nextcloud-office" ]]; then
            echo "nc_publish=true"  >> "$GITHUB_OUTPUT"
          else
            echo "nc_publish=false" >> "$GITHUB_OUTPUT"
          fi

          # Parse PRODUCT_VERSION / BUILD_NUMBER from the git tag.
          # Supported formats:
          #   v9.3.5-rc.1      →  product_version=9.3.5  build_number=0~rc.1
          #   v9.3.4           →  product_version=9.3.4  build_number=0
          # The "0~" prefix sorts a prerelease before the final release
          # (9.3.5-0~rc.1 < 9.3.5-0) in both dpkg and rpm.
          # Fall back to the VERSION file for non-tag builds.
          if [[ "$IS_TAG" == "true" && "$GITHUB_REF_NAME" =~ ^v([^-]+)-(.+)$ ]]; then
            echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=0~${BASH_REMATCH[2]}"  >> $GITHUB_OUTPUT
          elif [[ "$IS_TAG" == "true" && "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "build_number=0"                     >> $GITHUB_OUTPUT
          elif [[ "$IS_TAG" == "true" ]]; then
            echo "::error::Unsupported tag format: $GITHUB_REF_NAME (expected vX.Y.Z or vX.Y.Z-ID)"
            exit 1
          else
            VERSION_FILE=$(cat VERSION 2>/dev/null | tr -d '[:space:]')
            # Split VERSION file the same way as tags: 9.3.5-rc.1 → version=9.3.5 build=0~rc.1
            if [[ "${VERSION_FILE}" =~ ^([^-]+)-(.+)$ ]]; then
              echo "product_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
              echo "build_number=0~${BASH_REMATCH[2]}"  >> $GITHUB_OUTPUT
            else
              echo "product_version=${VERSION_FILE}" >> $GITHUB_OUTPUT
              echo "build_number=${{ env.BUILD_NUMBER }}"                        >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build all targets (packages → docker → develop)
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: ./build
          # For nextcloud-office, brand-server.hcl is appended; empty lines are
          # filtered by bake-action so euro-office sees only the base file.
          files: |
            ./docker-bake.hcl
            ${{ matrix.brand.extra_bake_files }}
          # extra_targets is either "" (euro-office) or "brand-icons," so the
          # comma-joined target list resolves correctly for both.
          targets: ${{ matrix.brand.extra_targets }}${{ needs.scope.outputs.targets }}
          # push=false here; per-target pushing is controlled via tags below.
          # Targets with empty tags= are not pushed regardless of this flag.
          push: false
          # When set, buildx ignores every cache-from below and rebuilds cold;
          # cache-to still repopulates fresh cache. pull refreshes base images.
          no-cache: ${{ steps.meta.outputs.no_cache == 'true' }}
          pull: ${{ steps.meta.outputs.no_cache == 'true' }}
          # Pin every target's build context to the repo root (".." from
          # source ./build). Without this override bake resolves the context
          # to ../../../build and every leg fails with "lstat ../../../build:
          # no such file or directory". (Note: comments must stay outside the
          # set: block below, which is parsed line by line.)
          set: |
            *.context=..
            core.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}core-buildcache-${{ matrix.arch }}
            core.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}core-buildcache-${{ matrix.arch }}
            core.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}core-buildcache-${{ matrix.arch }},mode=max
            core.tags=
            core-wasm.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache-${{ matrix.arch }}
            core-wasm.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache-${{ matrix.arch }}
            core-wasm.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}core-wasm-buildcache-${{ matrix.arch }},mode=max
            core-wasm.tags=
            sdkjs.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}sdkjs-buildcache-${{ matrix.arch }}
            sdkjs.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}sdkjs-buildcache-${{ matrix.arch }}
            sdkjs.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}sdkjs-buildcache-${{ matrix.arch }},mode=max
            sdkjs.tags=
            web-apps.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache-${{ matrix.arch }}
            web-apps.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache-${{ matrix.arch }}
            web-apps.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}web-apps-buildcache-${{ matrix.arch }},mode=max
            web-apps.tags=
            server.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}server-buildcache-${{ matrix.arch }}
            server.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}server-buildcache-${{ matrix.arch }}
            server.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}server-buildcache-${{ matrix.arch }},mode=max
            server.tags=
            example.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}example-buildcache-${{ matrix.arch }}
            example.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}example-buildcache-${{ matrix.arch }}
            example.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}example-buildcache-${{ matrix.arch }},mode=max
            example.tags=
            bundle.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}bundle-buildcache-${{ matrix.arch }}
            bundle.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}bundle-buildcache-${{ matrix.arch }}
            bundle.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}bundle-buildcache-${{ matrix.arch }},mode=max
            bundle.tags=
            packages.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}packages-buildcache-${{ matrix.arch }}
            packages.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}packages-buildcache-${{ matrix.arch }}
            packages.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}packages-buildcache-${{ matrix.arch }},mode=max
            packages.tags=
            cluster-docs.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}cluster-docs-buildcache-${{ matrix.arch }}
            cluster-docs.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}cluster-docs-buildcache-${{ matrix.arch }}
            cluster-docs.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}cluster-docs-buildcache-${{ matrix.arch }},mode=max
            cluster-docs.tags=${{ steps.meta.outputs.images_push == 'true' && format('{0}/{1}:{2}', env.REGISTRY, matrix.brand.cluster_docs, steps.meta.outputs.images_tag) || '' }}
            cluster-docs.output=${{ steps.meta.outputs.images_push == 'true' && 'type=registry' || 'type=cacheonly' }}
            cluster-example.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}cluster-example-buildcache-${{ matrix.arch }}
            cluster-example.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}cluster-example-buildcache-${{ matrix.arch }}
            cluster-example.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}cluster-example-buildcache-${{ matrix.arch }},mode=max
            cluster-example.tags=${{ steps.meta.outputs.images_push == 'true' && format('{0}/{1}:{2}', env.REGISTRY, matrix.brand.cluster_example, steps.meta.outputs.images_tag) || '' }}
            cluster-example.output=${{ steps.meta.outputs.images_push == 'true' && 'type=registry' || 'type=cacheonly' }}
            cluster-utils.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}cluster-utils-buildcache-${{ matrix.arch }}
            cluster-utils.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}cluster-utils-buildcache-${{ matrix.arch }}
            cluster-utils.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}cluster-utils-buildcache-${{ matrix.arch }},mode=max
            cluster-utils.tags=${{ steps.meta.outputs.images_push == 'true' && format('{0}/{1}:{2}', env.REGISTRY, matrix.brand.cluster_utils, steps.meta.outputs.images_tag) || '' }}
            cluster-utils.output=${{ steps.meta.outputs.images_push == 'true' && 'type=registry' || 'type=cacheonly' }}
            standalone.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}standalone-buildcache-${{ matrix.arch }}
            standalone.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}standalone-buildcache-${{ matrix.arch }}
            standalone.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}standalone-buildcache-${{ matrix.arch }},mode=max
            standalone.tags=${{ steps.meta.outputs.images_push == 'true' && format('{0}/{1}:{2}', env.REGISTRY, matrix.brand.image_name, steps.meta.outputs.images_tag) || (steps.meta.outputs.export_image == 'true' && steps.meta.outputs.e2e_image || '') }}
            standalone.output=${{ steps.meta.outputs.nc_publish == 'true' && format('type=oci,dest={0}/nc-standalone.oci.tar', runner.temp) || ((steps.meta.outputs.images_push == 'true' || steps.meta.outputs.export_image == 'true') && 'type=registry' || 'type=cacheonly') }}
            develop.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}develop-buildcache-${{ matrix.arch }}
            develop.cache-from+=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_fallback }}-${{ matrix.brand.cache_prefix }}develop-buildcache-${{ matrix.arch }}
            develop.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.CACHE_IMAGE_NAME }}:${{ steps.meta.outputs.cache_ref }}-${{ matrix.brand.cache_prefix }}develop-buildcache-${{ matrix.arch }},mode=max
            develop.tags=${{ steps.meta.outputs.develop_push == 'true' && format('{0}/{1}:latest-dev-{2}', env.REGISTRY, matrix.brand.image_name, matrix.arch) || '' }}
            develop.output=${{ steps.meta.outputs.develop_push == 'true' && 'type=registry' || 'type=cacheonly' }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ steps.meta.outputs.images_tag }}
          PRODUCT_VERSION: ${{ steps.meta.outputs.product_version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          BUILD_COMMITS: ${{ steps.meta.outputs.build_commits }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local
          # Prebuilt third-party libs (V8, ICU, Boost, ...) for the core build
          NEXTCLOUD_USER: ${{ secrets.NEXTCLOUD_USER }}
          NEXTCLOUD_PASS: ${{ secrets.NEXTCLOUD_PASS }}

      # Pushed with skopeo and a private authfile rather than docker login:
      # the docker credential store holds one login per host, and ghcr.io is
      # already logged in as GITHUB_TOKEN for the euro-office build cache.
      # continue-on-error: a failed push must not fail the build job, which
      # would also skip publish-euro-office-images. The failure still surfaces
      # in publish-nextcloud-images, which cannot find the per-arch image.
      - name: Push standalone image to nextcloud-releases (nextcloud-office)
        if: steps.meta.outputs.nc_publish == 'true'
        continue-on-error: true
        env:
          GHCR_USER:  ${{ secrets.NEXTCLOUD_RELEASES_USER }}
          GHCR_TOKEN: ${{ secrets.NEXTCLOUD_RELEASES_TOKEN }}
          IMAGE:      ${{ env.NEXTCLOUD_RELEASES_IMAGE }}
          IMAGE_TAG:  ${{ steps.meta.outputs.ref_name }}-${{ matrix.arch }}
          ARCHIVE:    ${{ runner.temp }}/nc-standalone.oci.tar
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          fi
          AUTH="$RUNNER_TEMP/nc-releases-auth.json"
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --authfile "$AUTH" -u "$GHCR_USER" --password-stdin
          skopeo copy --retry-times 3 --dest-authfile "$AUTH" \
            "oci-archive:$ARCHIVE" "docker://$IMAGE:$IMAGE_TAG"
          rm -f "$ARCHIVE" "$AUTH"

      # Handed to publish-nextcloud-download-server and
      # publish-nextcloud-github-release (every tag) and
      # publish-nextcloud-apt-dnf (stable vX.Y.Z tags only; that job
      # carries its own gate).
      - name: Upload packages as artifact (nextcloud-office)
        if: matrix.brand.name == 'nextcloud-office' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nc-packages-${{ matrix.arch }}
          path: |
            build/deploy/packages/*.deb
            build/deploy/packages/*.rpm
          if-no-files-found: error
          retention-days: 1

      # Lets a release/v* PR or a manual dispatch be tried out before tagging;
      # on tags publish-euro-office-release attaches them to the release.
      - name: Upload packages as artifact (euro-office)
        if: matrix.brand.name == 'euro-office' && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/') || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: |
            build/deploy/packages/*.deb
            build/deploy/packages/*.rpm
          if-no-files-found: error
          retention-days: 7
