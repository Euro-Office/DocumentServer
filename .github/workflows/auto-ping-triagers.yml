# Triaging a community issue means:
# - Check that it is understandable and reproducible; if details are missing,
#   ask the reporter and add `needs info`
# - Label it (e.g. `bug`, `enhancement`, `question`) and the affected area
# - If it may have a bigger impact (e.g. data loss, many users affected),
#   raise it with the team right away
# - If it describes a security vulnerability, hide its details and ask the
#   reporter to submit a private report via GitHub security advisories as
#   described in SECURITY.md
# - Close it with `duplicate`, `invalid` or `wontfix` if it does not need
#   further work

name: Request community issue triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  request-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Ask two random team members to triage a community issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const candidates = ['j-base64', 'MonaAghili', 'DmySyz', 'rikled', 'chrip', 'Aiiaiiio', 'moodyjmz'];
            const exclusions = ['HerrRichter', 'juliusknorr'];
            const count = 2;

            const author = context.payload.issue.user.login;
            if (candidates.includes(author) || exclusions.includes(author)) {
              core.info(`Opened by team member ${author}; skipping.`);
              return;
            }

            const pool = [...candidates];
            for (let i = pool.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            const picked = pool.slice(0, count);

            if (picked.length === 0) {
              core.info('No triagers configured.');
              return;
            }

            const mentions = picked.map(u => `@${u}`).join(' ');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `${mentions} Please triage this community-created issue.`,
            });
            core.info(`Requested community triage from: ${picked.join(', ')}`);
