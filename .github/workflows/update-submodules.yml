name: Update submodules to latest main branch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily — after the mirror job (05:30 UTC)

jobs:
  update-submodules:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork repo (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Submodule contents are not needed: gitlinks are updated in the index
          # and history is read from commit-only bare clones below.
          submodules: false
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN }}
          fetch-depth: 1

      - name: Configure git identity
        run: |
          git config user.name  "Euro-Office via GitHub Actions"
          git config user.email "actions@github.com"

      - name: Advance each submodule to latest default-branch commit
        run: |
          set -euo pipefail

          BODY="$RUNNER_TEMP/pr-body.md"
          {
            echo "Automated nightly submodule bump."
            echo
            echo "Updates each submodule to the latest commit on its tracking branch."
            echo
          } > "$BODY"

          # Enumerate every submodule from .gitmodules so none are missed.
          mapfile -t paths < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')

          for path in "${paths[@]}"; do
            old_sha="$(git ls-tree HEAD "$path" | awk '{print $3}')"
            if [ -z "$old_sha" ]; then
              echo "Skipping $path — no gitlink in HEAD"
              continue
            fi
            # Commits only (no trees/blobs): enough to resolve the default branch tip and build the changelog.
            meta="$RUNNER_TEMP/submodules/$path.git"
            git clone --quiet --bare --no-tags --filter=tree:0 "$(git config -f .gitmodules --get "submodule.$path.url")" "$meta"
            branch="$(git -C "$meta" symbolic-ref --short HEAD)"
            new_sha="$(git -C "$meta" rev-parse HEAD)"
            echo "Updating $path → $branch ($new_sha)"
            git update-index --cacheinfo "160000,$new_sha,$path"
            if [ "$old_sha" != "$new_sha" ]; then
              count="$(git -C "$meta" rev-list --count "$old_sha..$new_sha")"
              {
                echo "### $path ($branch) — $count new commit(s)"
                echo
                echo '```'
                git -C "$meta" log --no-merges --pretty=format:'%h %s' "$old_sha..$new_sha"
                echo
                echo '```'
                echo
              } >> "$BODY"
            fi
          done

      - name: Open PR if submodule pointers changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN }}
          branch: chore/nightly-submodule-bump
          base: main
          delete-branch: true
          author: "Euro-Office via GitHub Actions <actions@github.com>"
          committer: "Euro-Office via GitHub Actions <actions@github.com>"
          commit-message: |
            chore: update submodules to latest main branch

            Signed-off-by: Euro-Office via GitHub Actions <actions@github.com>
          title: "chore: update submodules to latest main branch"
          body-path: ${{ runner.temp }}/pr-body.md
