name: Dev images

# Builds dev images from dev/* branches, whose submodule pins are set with
# scripts/dev-pin.sh, and publishes them to separate *-dev packages. Images of
# deleted branches are removed by dev-images-cleanup.yml.
# See docs/dev-images.md.
on:
  push:
    branches: ['dev/**']

permissions: {}

concurrency:
  group: dev-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/euro-office
  ORG: euro-office
  IMAGE_NAME: documentserver-dev
  CLUSTER_IMG_DOCS: cluster-docs-dev
  CLUSTER_IMG_EXAMPLE: cluster-example-dev
  CLUSTER_IMG_UTILS: cluster-utils-dev
  CACHE_PACKAGE: documentserver-build-cache
  BUILD_ROOT: /package

jobs:
  build:
    name: Build (${{ matrix.arch }})
    if: ${{ !github.event.deleted }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read    # checkout
      packages: write   # push images and build cache to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
    steps:
      - name: Checkout (with pinned submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ github.token }}
          persist-credentials: false

      - name: Compute slug, version and pinned revisions
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          # Branch names end up in tags, labels and bake overrides.
          if [[ ! "$BRANCH" =~ ^dev/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Branch name '$BRANCH' may only contain letters, digits, '.', '_', '-' and '/'."
            exit 1
          fi

          # Build exactly the committed gitlinks: every submodule must be
          # checked out at its pinned commit (no '-', '+' or 'U' prefix).
          status="$(git submodule status --recursive)"
          if grep -v '^ ' <<<"$status"; then
            echo "::error::Submodules are not checked out at their pinned commits (see above)."
            exit 1
          fi

          slug="$(.github/scripts/dev-images.sh slug "$BRANCH")"
          sha="$(git rev-parse HEAD)"
          version="$(tr -d '[:space:]' < VERSION)"
          version="${version%%-*}"
          build_number="dev.${RUN_NUMBER}"

          {
            echo "slug=${slug}"
            echo "sha=${sha}"
            echo "product_version=${version}"
            echo "build_number=${build_number}"
            # Same format as build.yml; $name is expanded by git submodule foreach.
            # shellcheck disable=SC2016
            echo "build_commits=DocumentServer=${sha} $(git submodule foreach --quiet 'echo $name=$(git rev-parse HEAD)' | tr '\n' ' ')"
          } >> "$GITHUB_OUTPUT"

          # OCI labels on the four published images, as bake overrides.
          labels=(
            "org.opencontainers.image.source=https://github.com/${REPO}"
            "org.opencontainers.image.revision=${sha}"
            "org.opencontainers.image.version=${version}-${build_number}"
            "io.github.euro-office.dev.branch=${BRANCH}"
            "io.github.euro-office.dev.slug=${slug}"
          )
          while read -r sub_sha sub_path _; do
            labels+=("io.github.euro-office.submodule.${sub_path}=${sub_sha}")
          done < <(git submodule status | cut -c2-)
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "labels<<${delim}"
            for target in standalone cluster-docs cluster-example cluster-utils; do
              for label in "${labels[@]}"; do
                echo "${target}.labels.${label}"
              done
            done
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Dev images for \`${BRANCH}\` (${ARCH})"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| DocumentServer | \`${sha}\` |"
            echo "| Slug | \`${slug}\` |"
            echo "| Version | \`${version}-${build_number}\` |"
            echo
            echo "### Pinned submodules"
            echo
            echo "| Submodule | Commit |"
            echo "|---|---|"
            git submodule status --recursive | cut -c2- | awk '{ printf "| %s | `%s` |\n", $2, $1 }'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute bake overrides
        id: bake
        env:
          CACHE_REF: ${{ env.REGISTRY }}/${{ env.CACHE_PACKAGE }}:dev-${{ steps.meta.outputs.slug }}-{target}-${{ matrix.arch }}
          PUBLISHED: standalone cluster-docs cluster-example cluster-utils
          SKIP: develop
        run: .github/scripts/bake-overrides.sh

      # Dependency targets get no tags and push nothing. The four published
      # targets get the moving <slug> tag. Attestations are disabled so each
      # image is a single manifest.
      - name: Build and push dev images
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          files: ./docker-bake.hcl
          targets: standalone,cluster-docs,cluster-example,cluster-utils
          push: false
          provenance: false
          sbom: false
          set: |
            ${{ steps.bake.outputs.set }}
            standalone.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.slug }}
            standalone.output=type=registry
            cluster-docs.tags=${{ env.REGISTRY }}/${{ env.CLUSTER_IMG_DOCS }}:${{ steps.meta.outputs.slug }}
            cluster-docs.output=type=registry
            cluster-example.tags=${{ env.REGISTRY }}/${{ env.CLUSTER_IMG_EXAMPLE }}:${{ steps.meta.outputs.slug }}
            cluster-example.output=type=registry
            cluster-utils.tags=${{ env.REGISTRY }}/${{ env.CLUSTER_IMG_UTILS }}:${{ steps.meta.outputs.slug }}
            cluster-utils.output=type=registry
            ${{ steps.meta.outputs.labels }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ steps.meta.outputs.slug }}
          PRODUCT_VERSION: ${{ steps.meta.outputs.product_version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          BUILD_COMMITS: ${{ steps.meta.outputs.build_commits }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local

      - name: Verify single-manifest images and record digests
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Images"
            echo
            echo "| Image | Digest | DocumentServer |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for img in "$IMAGE_NAME" "$CLUSTER_IMG_DOCS" "$CLUSTER_IMG_EXAMPLE" "$CLUSTER_IMG_UTILS"; do
            ref="${REGISTRY}/${img}:${SLUG}"
            media_type="$(docker buildx imagetools inspect --raw "$ref" | jq -r '.mediaType')"
            case "$media_type" in
              application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json) ;;
              *)
                echo "::error::$ref is $media_type, expected a single image manifest (attestations disabled)."
                exit 1
                ;;
            esac
            digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref")"
            echo "| \`${ref}\` | \`${digest}\` | \`${SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      # Each build moves <slug>, so the previous image of the branch becomes an
      # untagged version. Deleting untagged versions is safe in these four
      # packages: their images are single manifests (checked above), so no
      # untagged version is a child of a tagged image. Never run this against
      # CACHE_PACKAGE: it is shared with build.yml, whose images have untagged
      # child manifests.
      - name: Delete untagged versions (documentserver-dev)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ env.ORG }}
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0

      - name: Delete untagged versions (cluster-docs-dev)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ env.ORG }}
          package-name: ${{ env.CLUSTER_IMG_DOCS }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0

      - name: Delete untagged versions (cluster-example-dev)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ env.ORG }}
          package-name: ${{ env.CLUSTER_IMG_EXAMPLE }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0

      - name: Delete untagged versions (cluster-utils-dev)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ env.ORG }}
          package-name: ${{ env.CLUSTER_IMG_UTILS }}
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
