name: Snap track release

# Opens a PR that moves the snap to the latest stable release.
on:
  schedule:
    - cron: '7 8 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: snap-track-release
  cancel-in-progress: false

jobs:
  track:
    if: vars.SNAP_STORE_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # push the branch
      pull-requests: write  # open the PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Compare with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: snap/update-release.sh

      - name: Open the PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # With the default token, CI does not start on the PR by itself.
          token: ${{ secrets.EURO_OFFICE_MIRROR_TOKEN || github.token }}
          branch: chore/snap-release
          base: main
          delete-branch: true
          add-paths: snap/local/release
          author: "Euro-Office via GitHub Actions <actions@github.com>"
          committer: "Euro-Office via GitHub Actions <actions@github.com>"
          commit-message: |
            chore(snap): update to the latest release

            Signed-off-by: Euro-Office via GitHub Actions <actions@github.com>
          title: "chore(snap): update to the latest release"
          body: Merging this builds the snap and uploads it to the candidate channel.
